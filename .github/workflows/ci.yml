name: Continuous Integration Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Core Verification Matrix
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Initialize Python 3.10 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        # Enabling built-in caching for pip to accelerate subsequent pipeline execution runs
        cache: 'pip'

    - name: Install Hardened Dependencies
      run: |
        python -m pip install --upgrade pip
        # Pinning exact tool versions to enforce complete deterministic immutability of the runner environment
        pip install radon==6.0.1 pytest==7.4.3 flake8==6.1.0 bandit==1.8.6 openai==1.3.0
        

    - name: Security Static Analysis (Bandit)
      run: |
        # Scan the codebase for security risks, vulnerabilities, or hardcoded secrets before execution
        python -m bandit -r core/ telemetry/ paradigms/ -ll

    - name: Strict Structural Code Linting (Flake8)
      run: |
        # Critical structural errors break the build automatically
        # NOTE: W503 (line break before binary operator) is ignored to align with modern PEP 8 practice
        python -m flake8 . \
          --count \
          --select=E9,F63,F7,F82 \
          --extend-ignore=W503 \
          --show-source \
          --statistics

        # Style and complexity failures still halt delivery
        python -m flake8 . \
          --count \
          --max-complexity=10 \
          --max-line-length=127 \
          --extend-ignore=W503 \
          --statistics

    - name: Execute Regression Test Matrix (Pytest)
      run: |
        # Runs our unit tests and verifies our edge-case exceptions
        python -m pytest tests/